kind = "web"
previewPath = "/"
title = "M.A.R.S. Trade Journal"
description = "A focused trading journal for recording, reviewing, and analyzing manual trades with clear P&L states, strategy context, and market regime notes."
version = "1.0.0"
id = "artifacts/mars-trade-journal"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25190

[services.development]
run = "pnpm --filter @workspace/mars-trade-journal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mars-trade-journal", "run", "build" ]
serve = "static"
publicDir = "artifacts/mars-trade-journal/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25190"
BASE_PATH = "/"
